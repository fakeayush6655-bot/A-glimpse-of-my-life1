<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Little Things</title>

    <link rel="stylesheet"
          href="assets/css/little-things.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap"
          rel="stylesheet">

</head>


<body>


    <!-- ======================================
                INTRO SCREEN
    ======================================= -->

    <section class="intro-screen">

        <div class="intro-content">

            <p class="intro-mini">
                A little collection of...
            </p>

            <h1>
                Little Things
            </h1>

            <p class="intro-subtitle">
                Collect the stars to discover
                the little things.
            </p>

            <button class="enter-btn">
                ✦ ENTER ✦
            </button>

        </div>

    </section>


    <!-- ======================================
                STAR WORLD
    ======================================= -->

    <main class="star-world">

        <div class="star-container">

            <!-- Stars will be created by JavaScript -->

        </div>


        <!-- ==================================
                    COLLECTION COUNT
        =================================== -->

        <div class="collection-count">

            ✦ <span id="collected">0</span> / 8

        </div>


        <!-- ==================================
                    MINI MEMORY
        =================================== -->

        <div class="memory-overlay">

            <div class="memory-window">

                <button class="close-memory">
                    ×
                </button>

                <div class="memory-media">
                    <!-- Photo / Video appears here -->
                </div>

                <h2 class="memory-title">
                    <!-- Title -->
                </h2>

                <p class="memory-text">
                    <!-- Line -->
                </p>

            </div>

        </div>


        <!-- ==================================
                    FINAL MESSAGE
        =================================== -->

        <div class="final-message">

            <div class="constellation">
                ✦　✦　✦　✦
                <br>
                　✦　✦　✦　✦
            </div>

            <h2>
                You found all the little things.
            </h2>

            <p>
                Funny how the smallest things
                can mean the most.
            </p>

            <a href="hub.html" class="continue-btn">
                Continue →
            </a>

        </div>


    </main>


    <script src="assets/js/little-things.js"></script>

    <script src="assets/js/music.js"></script>

</body>

</html>
